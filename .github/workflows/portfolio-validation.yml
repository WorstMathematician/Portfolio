name: Portfolio Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest nbformat "pandas>=2,<3" "numpy>=1.24,<3"

      - name: Compile Python files
        run: |
          python -m compileall -q .

      - name: Lint critical Python errors
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report non-blocking lint findings
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Validate Jupyter notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import nbformat

          notebooks = sorted(Path(".").rglob("*.ipynb"))
          if not notebooks:
              print("No Jupyter notebooks found.")
              raise SystemExit(0)

          failures = []
          for path in notebooks:
              try:
                  notebook = nbformat.read(path, as_version=4)
                  nbformat.validate(notebook)
                  print(f"OK: {path}")
              except Exception as exc:
                  failures.append((path, exc))
                  print(f"INVALID: {path}: {exc}", file=sys.stderr)

          if failures:
              raise SystemExit(f"{len(failures)} notebook(s) failed validation.")

          print(f"Validated {len(notebooks)} notebook(s).")
          PY

      - name: Run pytest when tests exist
        shell: bash
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path './.git/*' -print -quit | grep -q .; then
            pytest -q
          else
            echo "No pytest tests found - skipping test execution."
          fi
