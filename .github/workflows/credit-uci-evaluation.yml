name: UCI Credit Default Empirical Evaluation

on:
  push:
    paths:
      - 'Credit-Card-Default-Risk-Model/src/**'
      - 'Credit-Card-Default-Risk-Model/requirements.txt'
      - '.github/workflows/credit-uci-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate-uci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned-range runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Credit-Card-Default-Risk-Model/requirements.txt
      - name: Retrieve original UCI XLS
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python Credit-Card-Default-Risk-Model/src/download_uci.py; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "UCI acquisition failed after three attempts" >&2
              exit 1
            fi
            sleep 10
          done
      - name: Run actual historical-data modeling pipeline
        run: |
          python Credit-Card-Default-Risk-Model/src/risk_model.py --mode uci \
            --file 'Credit-Card-Default-Risk-Model/data/default of credit card clients.xls'
      - name: Verify empirical outputs and write data-source fingerprint
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          base = Path('Credit-Card-Default-Risk-Model')
          source = base / 'data' / 'default of credit card clients.xls'
          outputs = base / 'outputs' / 'uci'
          metrics = json.loads((outputs / 'metrics.json').read_text())
          assert metrics['data_source'] == 'uci', metrics['data_source']
          assert metrics['observations'] == 30000, metrics['observations']
          assert metrics['test_rows'] == 6000
          metadata = {
              'dataset': 'UCI Default of Credit Card Clients',
              'dataset_id': 350,
              'doi': '10.24432/C55S3H',
              'license': 'CC BY 4.0',
              'original_xls_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'observations': metrics['observations'],
              'source_url': 'https://archive.ics.uci.edu/dataset/350/default+of+credit+card+clients',
              'analysis': 'next-month historical cardholder default, not underwriting',
          }
          (outputs / 'source_manifest.json').write_text(
              json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          print('Original XLS SHA256:', metadata['original_xls_sha256'])
          print('Held-out ROC-AUC:', metrics['held_out_test']['roc_auc'])
          print('Held-out Brier:', metrics['held_out_test']['brier_score'])
          PY
      - name: Validate project tests
        run: python -m pytest -q Credit-Card-Default-Risk-Model/tests
      - name: Publish aggregate-only evaluation results to GitHub
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Credit-Card-Default-Risk-Model/outputs/uci/
          if git diff --cached --quiet; then
            echo 'Published UCI results unchanged.'
          else
            git commit -m 'Publish reproducible UCI credit default model evaluation'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
